version: 1
name: sdlc
steps:
  plan:
    bot: sdlc-planner
    produces: [plan.md, test-brief.md, impl-brief.md]
    publish: [plan.md]
    next: owner_go
  owner_go:
    gate: owner_go
    next: red
  red:
    bot: sdlc-test-writer
    inputs: [plan.md, test-brief.md]
    check: [only_paths_changed:tests, lint, tests_fail]
    tag: red
    next: green
  green:
    bot: sdlc-implementer
    inputs: [plan.md, impl-brief.md, red]
    check: [frozen_unchanged:red, project_check]
    tag: green
    next: review
    on_block: {test_defect: red_fix, scope_change: plan}
  red_fix:
    bot: sdlc-test-writer
    inputs: [block_reason, red]
    check: [only_paths_changed:tests, lint, tests_fail]
    tag: red
    next: green
    max_runs: 2
  review:
    bot: sdlc-reviewer
    inputs: [plan.md, "diff:red..green"]
    require_different_family: green
    next: pr
    on_verdict: {changes_needed: green}
    max_rounds: 2
  pr:
    action: open_pr
    next: merge
  merge:
    gate: owner_merge
    next: docs
  docs:
    bot: sdlc-docs
    inputs: [plan.md, merge]
limits:
  attempt_timeout_minutes: 90
  transient_retries: 2
  stall_alert_minutes: 30
templates: templates/
