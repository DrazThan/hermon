version: 1
name: sdlc-characterization
steps:
  plan:
    bot: sdlc-planner
    inputs: [block_reason]
    produces: [plan.md, test-brief.md, impl-brief.md, test-expectations.json]
    publish: [plan.md]
    next: owner_go
  owner_go:
    gate: owner_go
    next: characterize
  characterize:
    bot: sdlc-test-writer
    inputs: [plan.md, test-brief.md]
    check: [only_paths_changed:tests, lint, tests_pass]
    tag: characterized
    next: verify
    on_block: {scope_change: plan}
  verify:
    bot: sdlc-implementer
    inputs: [plan.md, impl-brief.md, characterized, block_reason]
    check: [only_paths_changed:tests, frozen_unchanged:characterized, tests_pass, project_check]
    tag: verified
    next: review
    on_block: {test_defect: characterize_fix, scope_change: plan}
  characterize_fix:
    bot: sdlc-test-writer
    inputs: [plan.md, test-brief.md, block_reason, characterized]
    check: [only_paths_changed:tests, lint, tests_pass]
    tag: characterized
    next: verify
    max_runs: 2
    on_block: {scope_change: plan}
  review:
    bot: sdlc-reviewer
    inputs: [plan.md, test-brief.md, "diff:characterized..verified"]
    require_different_family: verify
    next: pr
    on_verdict: {changes_needed: verify}
    max_rounds: 2
  pr:
    action: open_pr
    next: merge
  merge:
    gate: owner_merge
    next: docs
  docs:
    bot: sdlc-docs
    inputs: [plan.md, merge]
limits:
  attempt_timeout_minutes: 90
  transient_retries: 2
  stall_alert_minutes: 30
templates: templates/
