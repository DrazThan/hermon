version: 1
name: sdlc-light
steps:
  plan:
    bot: sdlc-planner
    inputs: [block_reason]
    produces: [plan.md, test-brief.md, impl-brief.md, test-expectations.json]
    max_runs: 2
    next: red
  red:
    bot: sdlc-test-writer
    inputs: [plan.md, test-brief.md, block_reason]
    check: ["only_paths_changed:tests", lint, tests_fail]
    tag: red
    next: green
    on_block: {scope_change: plan}
  green:
    bot: sdlc-implementer
    inputs: [plan.md, impl-brief.md, red, block_reason]
    check: ["red_guard:red", lint, tests_pass]
    tag: green
    max_runs: 4
    next: draft_pr
  draft_pr:
    action: open_draft_pr
    next: ci
  ci:
    gate: github_ci
    next: review
    on_block: {ci_failed: green}
  review:
    bot: sdlc-reviewer
    inputs: [plan.md, "diff:red..green", amendments]
    require_different_family: green
    review_amendments: {red: red, green: green}
    max_rounds: 2
    on_verdict: {changes_needed: green}
    next: ready
  ready:
    action: ready_pr
    on_block: {ci_failed: green}
    next: merge
  merge:
    gate: owner_merge
    next: docs
  docs:
    bot: sdlc-docs
    inputs: [plan.md, merge]
limits:
  attempt_timeout_minutes: 90
  transient_retries: 2
  stall_alert_minutes: 30
templates: templates/
