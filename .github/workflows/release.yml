name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # A tag whose version doesn't match Cargo.toml would ship a binary whose
      # `--version` disagrees with the formula's, so fail before releasing.
      - name: Check tag matches crate version
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag=${GITHUB_REF_NAME#v}
          test "$crate" = "$tag" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          }

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format
        run: cargo fmt --check

      # The profile Homebrew builds with (fat LTO, one codegen unit) — verify it
      # compiles here rather than in a user's `brew install`.
      - name: Release build
        run: cargo build --release --locked

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Formula (CLI) still builds from this source tarball GitHub
      # attaches automatically; the cask (app) gets its own zipped bundle
      # from the macos-bundle job below.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  # Builds Hermon.app (#78) and attaches it to the release created above, for
  # the `Casks/hermon-app.rb` cask in the tap. The Formula job stays
  # untouched — Homebrew CLI installs still build from source.
  macos-bundle:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked --version 0.11.0

      # `--format osx` skips the .dmg cargo-bundle also knows how to build —
      # the cask installs a zipped .app directly, no disk image needed.
      - name: Build Hermon.app
        run: cargo bundle --release --format osx

      # Finder launches CFBundleExecutable with no arguments, but the app
      # must start `hermon gui`. cargo-bundle has no hook for that, so the
      # compiled binary is renamed and a tiny wrapper script takes its place
      # as CFBundleExecutable, forwarding into `gui` (see Cargo.toml
      # [package.metadata.bundle] and NOTES in that file).
      - name: Wrap executable to launch `gui`
        run: |
          app=target/release/bundle/osx/Hermon.app
          macos_dir="$app/Contents/MacOS"
          mv "$macos_dir/hermon" "$macos_dir/hermon-bin"
          cat > "$macos_dir/hermon" <<'EOF'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/hermon-bin" gui "$@"
          EOF
          chmod +x "$macos_dir/hermon"

      - name: Zip Hermon.app
        run: |
          cd target/release/bundle/osx
          ditto -c -k --sequesterRsrc --keepParent Hermon.app Hermon.app.zip

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" target/release/bundle/osx/Hermon.app.zip

  # Static Linux agent binaries for `hermon agent` (#93): the agent runs
  # inside arbitrary containers, so it needs zero dynamic runtime deps —
  # musl gives that on any base image, alpine/distroless included. The
  # formula/cask above are untouched; this is a third, independent artifact
  # pair, brew-uninvolved.
  #
  # Toolchain, verified locally on both targets against this crate before
  # committing to it (2026-08-31): `cargo-zigbuild` (zig as C compiler *and*
  # linker), not `cross` (needs Docker-in-Docker and, worse, a rustup
  # toolchain matching the container's libc exactly — broke here with
  # "toolchain is not fully qualified") or a plain `rustup target add` +
  # system musl-gcc (would need two separate cross-gcc packages, one per
  # target arch). rusqlite's `bundled` feature (Cargo.toml) is the actual
  # risk: it compiles sqlite3.c from source via the `cc` crate, so the
  # cross-compiler has to handle C, not just Rust. zig ships prebuilt musl
  # sysroots for both x86_64 and aarch64, so that C compile just works with
  # no extra apt packages and no Cross.toml pre-build steps.
  # `pip install cargo-zigbuild` pulls in the `ziglang` PyPI package (a real
  # zig build, not a shim) alongside it, so no separate zig install step is
  # needed either. Confirmed both resulting binaries are static
  # (`file` reports "statically linked") and actually run in a bare
  # `alpine` container on both architectures.
  musl-agent:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add musl target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild==0.23.3

      - name: Build static agent binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Check the binary is actually static
        run: file target/${{ matrix.target }}/release/hermon | grep "statically linked"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="hermon-${{ matrix.target }}"
          cp target/${{ matrix.target }}/release/hermon "$out"
          gh release upload "$GITHUB_REF_NAME" "$out"
