[workspace]
members = ["crates/hermon", "crates/hermon-core", "crates/hermon-flow"]
default-members = ["crates/hermon"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
eframe = { version = "0.36.1", features = ["persistence"] }
egui_extras = "0.36.1"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
serde_path_to_error = "0.1.20"
tao = "0.37.0"
tray-icon = "0.24.2"
muda = "0.19.3"
tempfile = "3.27.0"
yaml-rust2 = { version = "0.13.0", default-features = false }

# Tuned for the shipped binary: one codegen unit and fat LTO so the whole
# crate graph is optimized together, symbols stripped since we don't ship
# debug info. Costs build time (a Homebrew source build pays it once);
# see packaging/RELEASE_NOTES.md for the measured size/startup numbers.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
